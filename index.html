      drawCanvasButton('bj_stand', W / 2 - 65, 415, 130, 46, '✋ RESTER', '#f59e0b', '#0f172a');
      if (P.tokens >= BJ.bet && BJ.playerHand.length === 2) {
        drawCanvasButton('bj_double', W / 2 + 80, 415, 130, 46, '⚡ DOUBLER', '#38bdf8', '#0f172a');
      }
    }
  }

  // Textes flottants
  ctx.textAlign = 'center';
  for (const p of pops) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.font = `800 ${Math.round(16 * (p.scale || 1))}px system-ui`;
    ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.lineWidth = 3;
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function handleCardCanvasClick(x, y) {
  for (const b of canvasButtons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      if (b.id === 'uno_draw') {
        if (UNO.turn === 'player' && !UNO.pickingColor) {
          UNO.playerHand.push(drawUnoCardFromDeck());
          SFX.card();
          UNO.turn = 'ai';
          UNO.aiTimer = 850;
          UNO.status = '📥 Tu as pioché. Au tour de l’IA...';
        }
      } else if (b.id === 'uno_call') {
        if (UNO.playerHand.length <= 2) {
          UNO.unoCalled = true;
          SFX.uno();
          addPop(W / 2, 310, '📣 UNO !', '#fde047', 1.3);
        }
      } else if (b.id.startsWith('uno_col_')) {
        chooseUnoWildColor(b.id.replace('uno_col_', ''));
      } else if (b.id.startsWith('uno_card_')) {
        playUnoPlayerCard(parseInt(b.id.replace('uno_card_', ''), 10));
      } else if (b.id === 'bat_step') {
        stepBataille();
      } else if (b.id === 'bj_bet_0') { BJ.bet = 0; SFX.card(); }
      else if (b.id === 'bj_bet_10') { BJ.bet = Math.min(10, P.tokens); SFX.card(); }
      else if (b.id === 'bj_bet_25') { BJ.bet = Math.min(25, P.tokens); SFX.card(); }
      else if (b.id === 'bj_deal') { startBjRound(); }
      else if (b.id === 'bj_hit') { bjHit(); }
      else if (b.id === 'bj_stand') { bjStand(); }
      else if (b.id === 'bj_double') { bjDouble(); }
      return;
    }
  }
}

/* ============================================================================
   9. JEUX DE TIR (9 MODES) — APPARITION, IMPACTS & RENDU
   ============================================================================ */
function spawnBoss(stage) {
  const hp = 25 + stage * 18;
  targets.push({
    type: 'boss', r: 58, pts: 35 + stage * 10, hp, maxHp: hp, life: Infinity,
    x: W / 2, y: 145, vx: 1.8 + stage * 0.35, vy: 0, grav: 0, y0: 145,
    bob: 0, rot: 0, flash: 0, dead: false, shootCD: 1800, stage
  });
}

function spawn() {
  let type = 'cible', spdMult = 1;
  if (mode === 'campaign') {
    const L = LEVELS[level];
    type = L.types[Math.floor(Math.random() * L.types.length)];
    spdMult = L.speed;
  } else if (mode === 'duckhunt') {
    const pool = ['canard', 'canard', 'pigeon', 'pigeon', 'doree'];
    type = pool[Math.floor(Math.random() * pool.length)];
    spdMult = 1.25 + Math.min(1.2, score / 120);
  } else if (mode === 'blitz') {
    const pool = ['cible', 'canard', 'blindee', 'caisse', 'doree', 'horloge', 'bombe'];
    type = pool[Math.floor(Math.random() * pool.length)];
    spdMult = 1.35 + Math.min(1.0, score / 150);
  } else if (mode === 'survival') {
    const pool = ['cible', 'canard', 'blindee', 'bombe', 'bombe', 'doree', 'caisse'];
    type = pool[Math.floor(Math.random() * pool.length)];
    spdMult = 1.2 + Math.min(1.5, score / 90);
  } else if (mode === 'invasion') {
    type = Math.random() < 0.3 ? 'meteore' : 'alien';
    spdMult = 1.0 + Math.min(1.6, score / 110);
  } else if (mode === 'boss') {
    if (!targets.some(t => t.type === 'boss')) spawnBoss(bossStage);
    return;
  } else if (mode === 'farwest') {
    const pool = ['bandit', 'bandit', 'bouteille', 'bouteille', 'otage', 'doree'];
    type = pool[Math.floor(Math.random() * pool.length)];
    spdMult = 1.15 + Math.min(1.0, score / 100);
  } else if (mode === 'ghost') {
    const pool = ['fantome', 'fantome', 'citrouille', 'chauve', 'doree'];
    type = pool[Math.floor(Math.random() * pool.length)];
    spdMult = 1.1 + Math.min(1.1, score / 110);
  } else if (mode === 'balloons') {
    const pool = ['ballon', 'ballon', 'ballon', 'montgolf', 'pinata', 'bombe'];
    type = pool[Math.floor(Math.random() * pool.length)];
    spdMult = 1.1 + Math.min(1.2, score / 120);
  }

  const k = KINDS[type];
  const lifeMult = mode === 'campaign' ? (1 - level * 0.06) : 0.9;
  const t = {
    type, r: k.r, pts: k.pts, hp: k.hp, maxHp: k.hp, life: k.life * lifeMult,
    x: 0, y: 0, vx: 0, vy: 0, grav: 0, y0: 0, bob: Math.random() * TAU, rot: 0, flash: 0, dead: false,
    color: ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#a855f7', '#ec4899'][Math.floor(Math.random() * 6)]
  };

  if (type === 'canard' || type === 'doree' || type === 'chauve') {
    const dir = Math.random() < 0.5 ? 1 : -1;
    const baseSpd = type === 'doree' ? 3.2 : (type === 'chauve' ? 2.8 : 1.85);
    t.vx = dir * (baseSpd + Math.random() * 1.4) * spdMult;
    t.x = dir > 0 ? -30 : W + 30;
    t.y0 = t.y = 90 + Math.random() * 180;
  } else if (type === 'pigeon') {
    const fromLeft = Math.random() < 0.5;
    t.x = fromLeft ? -20 : W + 20;
    t.y = H - 110 - Math.random() * 80;
    t.vx = (fromLeft ? 1 : -1) * (4.2 + Math.random() * 2.2) * spdMult;
    t.vy = -(7.6 + Math.random() * 2.4);
    t.grav = 0.14;
  } else if (type === 'alien' || type === 'meteore') {
    t.x = 70 + Math.random() * (W - 140);
    t.y = -30;
    t.vy = (type === 'meteore' ? 1.15 : 1.45) * spdMult;
    t.vx = type === 'alien' ? (Math.random() < 0.5 ? 1.3 : -1.3) : (Math.random() - 0.5) * 0.6;
  } else if (type === 'ballon' || type === 'montgolf' || type === 'pinata') {
    t.x = 80 + Math.random() * (W - 160);
    t.y = H - 55;
    t.vy = -(type === 'pinata' ? 1.1 : (type === 'montgolf' ? 1.4 : 2.1)) * spdMult;
    t.vx = (Math.random() - 0.5) * 0.8;
  } else if (type === 'fantome') {
    t.x = 80 + Math.random() * (W - 160);
    t.y0 = t.y = 110 + Math.random() * (H - 220);
    t.vx = (Math.random() < 0.5 ? 1 : -1) * 1.3 * spdMult;
  } else {
    t.x = 75 + Math.random() * (W - 150);
    t.y = 115 + Math.random() * (H - 235);
    t.y0 = t.y;
  }
  targets.push(t);
}

function triggerMysteryBox(x, y) {
  const roll = Math.random();
  if (roll < 0.45) {
    const bonusTokens = 8 + Math.floor(Math.random() * 10);
    P.tokens += bonusTokens;
    progressQuest('tokens', bonusTokens);
    addPop(x, y - 34, `📦 +${bonusTokens} 🪙 !`, '#ffd166', 1.2);
  } else if (roll < 0.75) {
    freezeTimer = 4000;
    addPop(x, y - 34, '❄️ GEL DU TEMPS 4s !', '#38bdf8', 1.2);
  } else {
    rapidTimer = 4500;
    addPop(x, y - 34, '⚡ TIR ULTRA-RAPIDE !', '#f472b6', 1.2);
  }
}

function hit(t, dmg) {
  if (t.dead) return;
  t.hp -= dmg;
  t.flash = 130;

  if (t.type === 'bombe' || t.type === 'otage') {
    t.dead = true;
    SFX.hit(t.type);
    shake = 18;
    combo = 1;
    comboTimer = 0;
    burst(t.x, t.y, '#ef4444', 28, 7.5);
    if (mode === 'survival') {
      lives--;
      addPop(t.x, t.y - 20, '💥 BOMBE ! -1 ❤️', '#ef4444', 1.3);
      if (lives <= 0) { endRun('💥 Explosion fatale !'); return; }
    } else {
      timeLeft = Math.max(0, timeLeft - 4);
      score = Math.max(0, score - 6);
      const label = t.type === 'otage' ? '🚫 Otage touché ! -6 pts / -4s' : '💥 Bombe ! -6 pts / -4s';
      addPop(t.x, t.y - 20, label, '#ef4444', 1.2);
    }
    return;
  }

  if (t.hp > 0) {
    SFX.hit('armor');
    burst(t.x, t.y, '#e2e8f0', 8, 3.5);
    addPop(t.x, t.y - 16, `-${dmg}`, '#cbd5e1', 0.9);
    return;
  }

  t.dead = true;
  combo = Math.min(5, combo + 1);
  comboTimer = COMBO_MAX_TIME;
  if (combo === 5) progressQuest('combo', 1, true);

  const multPts = t.pts * combo;
  score += multPts;
  const baseGain = t.type === 'pinata' ? 12 : (t.type === 'boss' ? 25 : Math.max(1, Math.ceil(t.pts * (1 + (combo - 1) * 0.25))));
  P.tokens += baseGain;
  P.xp += Math.max(1, t.pts);
  P.stats.totalKills++;

  progressQuest('kills', 1);
  progressQuest('tokens', baseGain);
  if (t.type === 'canard' || t.type === 'pigeon') progressQuest('ducks', 1);
  if (t.type === 'fantome' || t.type === 'citrouille' || t.type === 'chauve') progressQuest('ghosts', 1);
  if (t.type === 'ballon' || t.type === 'montgolf' || t.type === 'pinata') progressQuest('balloons', 1);
  if (t.type === 'boss') {
    progressQuest('boss', 1);
    P.stats.bossesDefeated++;
    bossStage++;
    timeLeft += 15;
    addPop(W / 2, 160, `🤖 BOSS VAINCU ! +15s & +25 🪙`, '#ffd166', 1.35);
    SFX.win();
  }

  dirty = true;
  save();
  SFX.hit(t.type, combo);

  if (t.type === 'horloge') {
    timeLeft += 3;
    addPop(t.x, t.y - 38, '⏱ +3 SECONDES !', '#38bdf8', 1.2);
  } else if (t.type === 'caisse') {
    triggerMysteryBox(t.x, t.y);
  }

  const col = t.color || (t.type === 'doree' ? '#fde047' : '#f87171');
  burst(t.x, t.y, col, (t.type === 'pinata' || t.type === 'boss') ? 45 : 18, 7);

  dying.push({
    type: t.type, r: t.r, hp: 0, maxHp: t.maxHp, color: t.color,
    x: t.x, y: t.y, vx: t.vx * 0.35, vy: -3.5,
    rot: 0, vr: (Math.random() - 0.5) * 0.45, life: 850, flash: 0
  });

  const comboTxt = combo > 1 ? ` (x${combo})` : '';
  addPop(t.x, t.y - 20, `+${multPts} pts${comboTxt} · +${baseGain} 🪙`, t.type === 'doree' ? '#fde047' : '#ffffff');
}

function shoot(now) {
  const w = WEAPONS[cur];
  const effectiveCool = rapidTimer > 0 ? Math.min(w.cool * 0.45, 110) : w.cool;
  if (state !== 'play' || !P.wOwned.includes(cur) || now - lastShot < effectiveCool || mouse.y > GUN.y - 35) return;

  lastShot = now;
  recoil = w.dmg >= 3 ? 13 : 6.5;
  flashT = 75;
  SFX.shoot(w);

  if (w.dmg < 3 && !w.splash) {
    parts.push({ x: GUN.x + 12, y: GUN.y - 8, vx: 1.6 + Math.random() * 2.2, vy: -3.2 - Math.random() * 2, vr: 0.4, rot: 0, life: 800, max: 800, c: '#eab308', shell: 1 });
  }
  if (w.dmg >= 3 || w.splash) shake = Math.min(15, shake + 6.5);

  const base = Math.atan2(mouse.y - GUN.y, mouse.x - GUN.x);
  burst(GUN.x + Math.cos(base) * 52, GUN.y + Math.sin(base) * 52, '#ffd166', 6, 3);

  let anyHit = false;
  for (let p = 0; p < w.pellets; p++) {
    const a = base + (Math.random() - 0.5) * 2 * w.spread;
    const dx = Math.cos(a), dy = Math.sin(a);
    let best = null, bp = Infinity;

    for (const t of targets) {
      if (t.dead) continue;
      if (mode === 'ghost' && t.type === 'fantome' && Math.hypot(t.x - mouse.x, t.y - mouse.y) > 135) continue;
      const vx = t.x - GUN.x, vy = t.y - GUN.y, pr = vx * dx + vy * dy;
      if (pr < 0 || pr >= bp) continue;
      if (Math.abs(vx * dy - vy * dx) < t.r + 2) { best = t; bp = pr; }
    }

    const L = best ? bp : 1200;
    tracers.push({ x2: GUN.x + dx * L, y2: GUN.y + dy * L, life: 130, max: 130, color: w.color, width: w.dmg >= 4 ? 4 : 2.2 });

    if (best) {
      anyHit = true;
      hit(best, w.dmg);
      if (w.splash) {
        SFX.explode();
        rings.push({ x: best.x, y: best.y, R: w.splash, life: 420, ml: 420, color: '#fb923c' });
        for (const t of targets) {
          if (t !== best && !t.dead && Math.hypot(t.x - best.x, t.y - best.y) < w.splash) {
            hit(t, w.dmg);
          }
        }
      }
    }
  }

  if (!anyHit && w.pellets === 1 && w.cool > 200 && combo > 1) {
    combo = 1;
    comboTimer = 0;
  }
}

function updateShooting(dt) {
  if (freezeTimer > 0) freezeTimer = Math.max(0, freezeTimer - dt);
  if (rapidTimer > 0) rapidTimer = Math.max(0, rapidTimer - dt);

  if (combo > 1) {
    comboTimer -= dt;
    if (comboTimer <= 0) { combo = 1; comboTimer = 0; }
  }

  if (freezeTimer <= 0) {
    if (mode !== 'survival' && mode !== 'invasion') {
      timeLeft -= dt / 1000;
      if (mode === 'campaign' && score >= LEVELS[level].goal) { winCampaignLevel(); return; }
      if (timeLeft <= 0) {
        timeLeft = 0;
        if (mode === 'campaign') {
          if (score >= LEVELS[level].goal) winCampaignLevel();
          else endRun('⏱ Temps écoulé !');
        } else {
          endRun('⏱ Fin du chrono !');
        }
        return;
      }
    } else {
      timeLeft += dt / 1000;
    }
  }

  spawnT -= dt;
  const maxTargets = mode === 'campaign' ? LEVELS[level].max : (mode === 'boss' ? 5 : 9);
  const baseSpawn = mode === 'campaign' ? LEVELS[level].spawn :
                    mode === 'blitz' ? 520 :
                    mode === 'boss' ? 1200 :
                    mode === 'survival' ? Math.max(360, 750 - score * 2) : 580;

  if (spawnT <= 0) {
    if (targets.length < maxTargets) spawn();
    spawnT = baseSpawn * (0.65 + Math.random() * 0.6);
  }

  const timeScale = freezeTimer > 0 ? 0.25 : 1;

  for (const t of targets) {
    t.x += t.vx * (dt / 16) * timeScale;
    t.y += t.vy * (dt / 16) * timeScale;
    if (t.grav) t.vy += t.grav * (dt / 16) * timeScale;
    if (freezeTimer <= 0) t.life -= dt;
    if (t.flash > 0) t.flash -= dt;

    if (t.type === 'canard' || t.type === 'doree' || t.type === 'chauve') {
      t.y = t.y0 + Math.sin(clock / 360 + t.bob) * 12;
    } else if (t.type === 'caisse' || t.type === 'horloge') {
      t.rot = Math.sin(clock / 240 + t.bob) * 0.16;
    } else if (t.type === 'alien' || t.type === 'fantome') {
      if (t.x < 45 || t.x > W - 45) t.vx *= -1;
      if (t.type === 'fantome') t.y = t.y0 + Math.sin(clock / 420 + t.bob) * 18;
    } else if (t.type === 'meteore') {
      t.rot += 0.03 * (dt / 16) * timeScale;
    } else if (t.type === 'ballon' || t.type === 'montgolf' || t.type === 'pinata') {
      t.x += Math.sin(clock / 320 + t.bob) * 0.7 * timeScale;
    } else if (t.type === 'boss') {
      if (t.x < 95 || t.x > W - 95) t.vx *= -1;
      t.y = 140 + Math.sin(clock / 500) * 24;
      t.rot += 0.035 * (dt / 16) * timeScale;
      t.shootCD -= dt * timeScale;
      if (t.shootCD <= 0) {
        t.shootCD = Math.max(950, 2100 - t.stage * 180);
        const ang = Math.atan2(GUN.y - t.y, GUN.x - t.x);
        targets.push({
          type: 'bossOrb', r: 16, pts: 2, hp: 1, maxHp: 1, life: Infinity,
          x: t.x, y: t.y + 35, vx: Math.cos(ang) * 2.6, vy: Math.sin(ang) * 2.6,
          grav: 0, y0: t.y, bob: 0, rot: 0, flash: 0, dead: false
        });
      }
    }

    if (!t.dead) {
      if ((t.type === 'alien' || t.type === 'meteore' || t.type === 'bossOrb') && t.y >= H - 82) {
        t.dead = true;
        SFX.hit('bombe');
        shake = 16;
        burst(t.x, H - 75, '#ef4444', 24, 6);
        if (mode === 'boss') {
          timeLeft = Math.max(0, timeLeft - 5);
          addPop(t.x, H - 95, '💥 ORBE BOSS ! -5s', '#ef4444', 1.2);
        } else {
          lives--;
          addPop(t.x, H - 95, '💥 IMPACT ! -1 ❤️', '#ef4444', 1.2);
          if (lives <= 0) { endRun('👾 Le stand a été envahi !'); return; }
        }
      } else if (mode === 'survival' && t.type === 'doree' && (t.x < -50 || t.x > W + 50 || t.life <= 0)) {
        t.dead = true;
        lives--;
        SFX.lose();
        addPop(W / 2, 120, '⚠️ Cible dorée échappée ! -1 ❤️', '#facc15', 1.15);
        if (lives <= 0) { endRun('💔 Plus de vies !'); return; }
      }
    }
  }

  targets = targets.filter(t => !t.dead && t.life > 0 && t.x > -75 && t.x < W + 75 && t.y > -80 && t.y < H + 40);
  for (const d of dying) { d.vy += 0.32 * dt / 16; d.x += d.vx * dt / 16; d.y += d.vy * dt / 16; d.rot += d.vr * dt / 16; d.life -= dt; }
  dying = dying.filter(d => d.life > 0);
  for (const t of tracers) t.life -= dt;
  tracers = tracers.filter(t => t.life > 0);
  for (const r of rings) r.life -= dt;
  rings = rings.filter(r => r.life > 0);
  for (const c of clouds) { c.x += c.v * dt / 16; if (c.x > W + 100) c.x = -100; }
  for (const wp of weatherParts) {
    wp.x += wp.vx * dt / 16; wp.y += wp.vy * dt / 16;
    if (wp.y > H - 65) { wp.y = -10; wp.x = Math.random() * W; }
    if (wp.x < 0) wp.x = W; if (wp.x > W) wp.x = 0;
  }

  recoil *= Math.pow(0.84, dt / 16);
  flashT -= dt;
  if (holding) shoot(performance.now());
}

function drawTarget(t, T) {
  const r = t.r;
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(t.rot || 0);

  if (t.type === 'cible') {
    ctx.fillStyle = '#fff'; circ(0, 0, r);
    ctx.fillStyle = T.ring; circ(0, 0, r * 0.66);
    ctx.fillStyle = '#fff'; circ(0, 0, r * 0.33);
  } else if (t.type === 'canard' || t.type === 'doree') {
    const dir = t.vx >= 0 ? 1 : -1;
    const bodyCol = t.type === 'doree' ? '#ffd700' : T.duck;
    if (t.type === 'doree') { ctx.shadowColor = '#fde047'; ctx.shadowBlur = 14; }
    ctx.fillStyle = bodyCol;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.15, r * 0.62, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(-dir * r * 0.2, -r * 0.1 + Math.sin(clock / 85) * r * 0.35, r * 0.55, r * 0.22, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = bodyCol; circ(dir * r * 0.82, -r * 0.52, r * 0.45);
    ctx.fillStyle = '#f97316';
    ctx.beginPath(); ctx.moveTo(dir * r * 1.2, -r * 0.55); ctx.lineTo(dir * r * 1.6, -r * 0.42); ctx.lineTo(dir * r * 1.2, -r * 0.32); ctx.fill();
    ctx.shadowBlur = 0;
  } else if (t.type === 'pigeon') {
    ctx.fillStyle = '#ea580c';
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.2, r * 0.5, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#fdba74'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, -2, r * 0.85, r * 0.28, 0, 0, TAU); ctx.stroke();
  } else if (t.type === 'blindee') {
    ctx.fillStyle = '#475569'; circ(0, 0, r);
    ctx.lineWidth = 4.5; ctx.strokeStyle = '#cbd5e1'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t.hp, 0, 1);
  } else if (t.type === 'caisse') {
    ctx.fillStyle = '#92400e'; ctx.fillRect(-r, -r, 2 * r, 2 * r);
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 2.5; ctx.strokeRect(-r, -r, 2 * r, 2 * r);
    ctx.fillStyle = '#ffd166'; ctx.font = 'bold 21px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', 0, 1);
  } else if (t.type === 'horloge') {
    ctx.fillStyle = '#e0f2fe'; circ(0, 0, r);
    ctx.lineWidth = 3.5; ctx.strokeStyle = '#0284c7'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#0369a1'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('+3s', 0, 1);
  } else if (t.type === 'bombe') {
    ctx.fillStyle = '#18181b'; circ(0, 0, r);
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#ef4444'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('💣', 0, 1);
  } else if (t.type === 'alien') {
    ctx.fillStyle = '#9333ea';
    ctx.beginPath(); ctx.ellipse(0, 4, r * 1.25, r * 0.48, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath(); ctx.arc(0, -3, r * 0.62, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(t.hp, 0, 8);
  } else if (t.type === 'meteore') {
    ctx.fillStyle = '#7c2d12'; circ(0, 0, r);
    ctx.strokeStyle = '#f97316'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#fed7aa'; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t.hp, 0, 1);
  } else if (t.type === 'boss') {
    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 5;
    ctx.setLineDash([28, 18]);
    ctx.beginPath(); ctx.arc(0, 0, r + 10, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#1e293b'; circ(0, 0, r);
    ctx.lineWidth = 5; ctx.strokeStyle = '#f43f5e'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.rotate(-(t.rot || 0));
    ctx.font = '46px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🤖', 0, -4);
    ctx.fillStyle = '#fde047'; ctx.font = '900 15px system-ui';
    ctx.fillText(`${t.hp} PV`, 0, 34);
  } else if (t.type === 'bossOrb') {
    ctx.fillStyle = '#f43f5e'; circ(0, 0, r);
    ctx.fillStyle = '#ffe4e6'; circ(0, 0, r * 0.45);
  } else if (t.type === 'bandit') {
    ctx.fillStyle = '#78350f'; circ(0, 0, r);
    ctx.lineWidth = 3; ctx.strokeStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.font = '26px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🤠', 0, 2);
  } else if (t.type === 'otage') {
    ctx.fillStyle = '#065f46'; circ(0, 0, r);
    ctx.lineWidth = 3; ctx.strokeStyle = '#34d399'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.font = '26px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🙋', 0, 2);
  } else if (t.type === 'bouteille') {
    ctx.fillStyle = '#15803d';
    ctx.fillRect(-7, -8, 14, 22);
    ctx.fillRect(-4, -18, 8, 10);
    ctx.fillStyle = '#fef08a'; ctx.fillRect(-5, -2, 10, 8);
  } else if (t.type === 'fantome') {
    const dist = Math.hypot(t.x - mouse.x, t.y - mouse.y);
    const vis = mode === 'ghost' ? clamp(1.2 - dist / 150, 0.12, 1) : 1;
    ctx.globalAlpha = vis;
    ctx.font = '38px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('👻', 0, 0);
  } else if (t.type === 'citrouille') {
    ctx.font = '36px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🎃', 0, 0);
  } else if (t.type === 'chauve') {
    ctx.font = '30px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🦇', 0, 0);
  } else if (t.type === 'ballon') {
    ctx.fillStyle = t.color || '#ef4444';
    ctx.beginPath(); ctx.ellipse(0, -3, r * 0.85, r, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, r - 3); ctx.lineTo(0, r + 14); ctx.stroke();
  } else if (t.type === 'montgolf') {
    ctx.fillStyle = '#f97316';
    ctx.beginPath(); ctx.arc(0, -6, r * 0.9, 0, TAU); ctx.fill();
    ctx.fillStyle = '#78350f'; ctx.fillRect(-8, r * 0.75, 16, 10);
  } else if (t.type === 'pinata') {
    ctx.fillStyle = '#ec4899'; circ(0, 0, r);
    ctx.strokeStyle = '#fde047'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.font = '36px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🪅', 0, -2);
    ctx.fillStyle = '#fff'; ctx.font = '900 13px system-ui';
    ctx.fillText(t.hp, 0, 22);
  }

  if (t.flash > 0) {
    ctx.globalAlpha = 0.65 * (t.flash / 130);
    ctx.fillStyle = '#fff';
    circ(0, 0, r);
  }
  ctx.restore();
}

function drawShooting() {
  const T = THEMES[P.theme];
  const ph = performance.now() / 40;
  const sky = mode === 'ghost'
    ? ['#03050a', '#0a0f1d', '#050811']
    : T.disco
      ? [`hsl(${ph % 360},85%,32%)`, `hsl(${(ph + 120) % 360},85%,50%)`, `hsl(${(ph + 240) % 360},80%,28%)`]
      : T.sky;

  ctx.save();
  if (shake > 0.4) ctx.translate(rr(-shake, shake), rr(-shake, shake));

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, sky[0]);
  g.addColorStop(0.58, sky[1]);
  g.addColorStop(1, sky[2]);
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  if (T.stars || mode === 'ghost') {
    for (const s of stars) {
      ctx.globalAlpha = 0.4 + 0.6 * Math.sin(clock / 350 + s.p);
      ctx.fillStyle = '#fff';
      circ(s.x, s.y, s.r);
    }
    ctx.globalAlpha = 1;
  }

  if (T.disco && mode !== 'ghost') {
    ctx.save();
    ctx.globalAlpha = 0.22;
    for (let i = 0; i < 4; i++) {
      ctx.strokeStyle = `hsl(${(ph * 3 + i * 90) % 360}, 100%, 60%)`;
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.moveTo(W * (0.2 + i * 0.2), 0);
      ctx.lineTo(W / 2 + Math.sin(clock / 400 + i) * 380, H - 70);
      ctx.stroke();
    }
    ctx.restore();
  }

  if (mode !== 'ghost') {
    ctx.fillStyle = T.cloud || 'rgba(255,255,255,.82)';
    for (const c of clouds) {
      ctx.beginPath(); ctx.arc(c.x, c.y, 18 * c.s, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(c.x + 22 * c.s, c.y - 8 * c.s, 24 * c.s, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(c.x + 48 * c.s, c.y, 18 * c.s, 0, TAU); ctx.fill();
    }
  }

  if (T.peaks && mode !== 'ghost') {
    ctx.fillStyle = T.peaks;
    ctx.beginPath();
    ctx.moveTo(0, H - 70); ctx.lineTo(150, 245); ctx.lineTo(300, H - 70);
    ctx.lineTo(480, 175); ctx.lineTo(680, H - 70); ctx.lineTo(820, 295);
    ctx.lineTo(W, H - 70); ctx.closePath(); ctx.fill();
  }

  if ((T.snow || T.embers) && mode !== 'ghost') {
    ctx.fillStyle = T.snow ? 'rgba(255,255,255,.85)' : 'rgba(255,140,0,.75)';
    for (const wp of weatherParts) {
      const wy = T.embers ? (H - 70 - wp.y) : wp.y;
      circ(wp.x, wy, wp.s);
    }
  }

  ctx.fillStyle = mode === 'ghost' ? '#111827' : T.ground;
  ctx.fillRect(0, H - 70, W, 70);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fillRect(0, H - 70, W, 4);

  if (freezeTimer > 0) {
    ctx.fillStyle = 'rgba(56, 189, 248, 0.14)';
    ctx.fillRect(0, 0, W, H);
  }

  for (const d of dying) {
    ctx.globalAlpha = Math.max(0, d.life / 850);
    drawTarget(d, T);
  }
  ctx.globalAlpha = 1;
  for (const t of targets) drawTarget(t, T);

  if (mode === 'ghost') {
    ctx.save();
    const grad = ctx.createRadialGradient(mouse.x, mouse.y, 45, mouse.x, mouse.y, 175);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.75, 'rgba(2,6,23,0.72)');
    grad.addColorStop(1, 'rgba(2,6,23,0.92)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H - 70);
    ctx.restore();
  }

  for (const t of tracers) {
    ctx.globalAlpha = Math.max(0, t.life / t.max);
    ctx.strokeStyle = t.color;
    ctx.lineWidth = t.width || 2.2;
    ctx.beginPath(); ctx.moveTo(GUN.x, GUN.y - 4); ctx.lineTo(t.x2, t.y2); ctx.stroke();
  }

  for (const r of rings) {
    const k = 1 - r.life / r.ml;
    ctx.globalAlpha = r.life / r.ml;
    ctx.strokeStyle = r.color || '#ffb347';
    ctx.lineWidth = 6 * (1 - k) + 1.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, k * r.R, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const p of parts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.c;
    if (p.shell) ctx.fillRect(-3, -1.5, 6, 3);
    else circ(0, 0, p.s);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  ctx.font = '72px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(SHOOTERS[P.shooter].e, GUN.x - 32, 455 + Math.sin(ph / 8) * 4);

  const w = WEAPONS[cur];
  const a = Math.atan2(mouse.y - GUN.y, mouse.x - GUN.x);
  ctx.save();
  ctx.translate(GUN.x - Math.cos(a) * recoil, GUN.y - Math.sin(a) * recoil);
  ctx.rotate(a);
  ctx.fillStyle = '#1e293b'; ctx.fillRect(-8, -7, 22, 14);
  ctx.fillStyle = '#0f172a'; ctx.fillRect(10, -5.5, 52, 11);
  ctx.fillStyle = w.color; ctx.fillRect(10, -3.5, 46, 7);
  if (flashT > 0) {
    ctx.globalAlpha = Math.max(0, flashT / 75);
    ctx.fillStyle = '#ffd166';
    circ(65, 0, 9 + Math.random() * 10);
  }
  ctx.restore();

  const spreadRadius = 11 + w.spread * 95 + recoil * 0.9;
  ctx.strokeStyle = mode === 'ghost' ? '#38bdf8' : (rapidTimer > 0 ? '#f472b6' : '#111827');
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, spreadRadius, 0, TAU);
  ctx.moveTo(mouse.x - spreadRadius - 7, mouse.y); ctx.lineTo(mouse.x - spreadRadius + 4, mouse.y);
  ctx.moveTo(mouse.x + spreadRadius - 4, mouse.y); ctx.lineTo(mouse.x + spreadRadius + 7, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - spreadRadius - 7); ctx.lineTo(mouse.x, mouse.y - spreadRadius + 4);
  ctx.moveTo(mouse.x, mouse.y + spreadRadius - 4); ctx.lineTo(mouse.x, mouse.y + spreadRadius + 7);
  ctx.stroke();

  ctx.fillStyle = '#ef4444';
  circ(mouse.x, mouse.y, 2.2);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  for (const p of pops) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.font = `800 ${Math.round(16 * (p.scale || 1))}px system-ui`;
    ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.lineWidth = 3;
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ============================================================================
   10. ORCHESTRATION DES MODES, HUD, BOUTIQUES & QUÊTES
   ============================================================================ */
function startMode(selectedMode) {
  mode = selectedMode;
  const mObj = MODES.find(m => m.id === mode);
  cv.className = mObj.cat === 'tir' ? 'aim-cursor' : 'ui-cursor';

  level = 0; total = 0; score = 0; lives = 3; bossStage = 1;
  combo = 1; comboTimer = 0; freezeTimer = 0; rapidTimer = 0;
  targets = []; dying = []; parts = []; tracers = []; rings = []; pops = [];
  spawnT = 0; lastShot = 0;

  if (mObj.cat === 'tir') {
    if (mode === 'campaign') timeLeft = LEVELS[0].time;
    else if (mode === 'duckhunt') timeLeft = 50;
    else if (mode === 'blitz') timeLeft = 60;
    else if (mode === 'boss') { timeLeft = 45; spawnBoss(1); }
    else if (mode === 'farwest') timeLeft = 50;
    else if (mode === 'ghost') timeLeft = 55;
    else if (mode === 'balloons') timeLeft = 50;
    else timeLeft = 0;
  } else if (mode === 'course') {
    initRaceMode();
  } else if (mode === 'drift') {
    initDriftMode();
  } else if (mode === 'uno') {
    initUno();
  } else if (mode === 'bataille') {
    initBataille();
  } else if (mode === 'blackjack') {
    initBlackjack();
  }

  state = 'play';
  $('overlay').classList.add('hidden');
  SFX.init();
}

function nextCampaignLevel() {
  const L = LEVELS[level];
  score = 0;
  timeLeft = L.time;
  targets = []; dying = []; parts = []; tracers = []; rings = []; pops = [];
  spawnT = 0;
  state = 'play';
  $('overlay').classList.add('hidden');
}

function recordBest(finalScore) {
  if (finalScore > (P.best[mode] || 0)) {
    P.best[mode] = finalScore;
    save();
    dirty = true;
    return true;
  }
  return false;
}

function endRun(reasonTitle) {
  state = 'gameover';
  holding = false;
  const finalTotal = mode === 'campaign' ? total + score : score;
  const isNewRecord = recordBest(finalTotal);
  showMenuOverlay(
    reasonTitle,
    `Score final : <strong>${finalTotal} pts</strong> ${isNewRecord ? '🏆 <b>NOUVEAU RECORD !</b>' : `(Record : ${P.best[mode]} pts)`}<br>Choisis un jeu parmi les 14 bornes ou rejoue immédiatement !`,
    'Rejouer ce jeu'
  );
}

function winCampaignLevel() {
  total += score;
  P.maxLevel = Math.max(P.maxLevel, level + 1);
  recordBest(total);
  save();
  dirty = true;
  state = 'levelup';
  holding = false;
  SFX.win();

  if (level === LEVELS.length - 1) {
    showMenuOverlay(
      '🏆 Campagne Terminée !',
      `Bravo ! Tu as vaincu le niveau Expert avec <strong>${total} points</strong>. Continue en mode Infini ou découvre les jeux de Voitures & Cartes !`,
      'Continuer (Mode Infini)'
    );
  } else {
    const N = LEVELS[level + 1];
    showMenuOverlay(
      `✅ Niveau ${level + 1} réussi !`,
      `Score : ${score} / ${LEVELS[level].goal}.<br>Prochain défi : <strong>Niveau ${level + 2} (${N.label})</strong> — Objectif ${N.goal} pts en ${N.time}s.`,
      'Niveau suivant'
    );
  }
}

function togglePause() {
  if (state === 'play') {
    state = 'paused';
    holding = false;
    showMenuOverlay('⏸ Pause', 'La partie est en pause. Le chronomètre est arrêté.', 'Reprendre');
  } else if (state === 'paused') {
    state = 'play';
    $('overlay').classList.add('hidden');
  }
}

function openModeSelector() {
  state = 'menu';
  holding = false;
  showMenuOverlay(
    '🕹️ Méga Arcade Mania — 14 Mini-Jeux',
    'Explore nos 3 salles : <b>Tir (9 jeux)</b>, <b>Voitures (2 jeux)</b> et <b>Cartes : UNO, Bataille & Blackjack (3 jeux)</b> !',
    'Lancer le jeu sélectionné'
  );
}

function showMenuOverlay(title, htmlDesc, btnText) {
  $('title').textContent = title;
  $('desc').innerHTML = htmlDesc;
  $('go').textContent = btnText;

  const list = $('modes-list');
  const filters = $('cat-filters');
  list.innerHTML = '';
  const showCards = (state === 'menu' || state === 'gameover');
  list.style.display = showCards ? 'grid' : 'none';
  filters.style.display = showCards ? 'flex' : 'none';

  if (showCards) {
    const filtered = hubCat === 'all' ? MODES : MODES.filter(m => m.cat === hubCat);
    filtered.forEach(m => {
      const tagClass = m.cat === 'tir' ? 'tag-tir' : (m.cat === 'voiture' ? 'tag-voiture' : 'tag-cartes');
      const card = document.createElement('div');
      card.className = 'mode-card' + (mode === m.id ? ' selected' : '');
      card.innerHTML = `
        <div>
          <div class="m-head">
            <div class="m-title">${m.icon} ${m.name}</div>
            <span class="m-tag ${tagClass}">${m.tag}</span>
          </div>
          <div class="m-desc">${m.desc}</div>
        </div>
        <div class="m-foot">
          <span>🏆 Record : ${P.best[m.id] || 0} pts</span>
          <span>${mode === m.id ? '✔ Sélectionné' : 'Choisir →'}</span>
        </div>
      `;
      card.onclick = () => {
        mode = m.id;
        showMenuOverlay(title, htmlDesc, btnText);
      };
      list.appendChild(card);
    });
  }
  $('overlay').classList.remove('hidden');
}

function getPlayerRank() {
  const lvl = Math.floor(Math.sqrt(P.xp / 25)) + 1;
  const titles = ['Novice', 'Apprenti', 'Joueur', 'Pilote & Tireur', 'As de l’Arcade', 'Maître Multi-Jeux', 'Légende Absolue'];
  const title = titles[Math.min(titles.length - 1, Math.floor((lvl - 1) / 2))];
  return `⭐ Niv. ${lvl} · ${title}`;
}

function updateHUD() {
  $('rank-badge').textContent = getPlayerRank();
  const mObj = MODES.find(m => m.id === mode);
  const cp = $('combo-pill');

  if (mObj.cat === 'tir') {
    if (mode === 'campaign') {
      const L = LEVELS[level];
      $('score').textContent = `🎯 Niv.${level + 1} (${L.label}) · ${score} / ${L.goal}`;
      $('barfill').style.width = Math.min(100, (score / L.goal) * 100) + '%';
    } else if (mode === 'boss') {
      const b = targets.find(t => t.type === 'boss');
      $('score').textContent = `🤖 Boss #${bossStage} · ${score} pts`;
      $('barfill').style.width = b ? Math.max(0, (b.hp / b.maxHp) * 100) + '%' : '100%';
    } else if (mode === 'survival' || mode === 'invasion') {
      const hearts = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
      $('score').textContent = `${mObj.icon} ${score} pts · ${hearts}`;
      $('barfill').style.width = Math.min(100, (score % 50) * 2) + '%';
    } else {
      $('score').textContent = `${mObj.icon} ${mObj.name.replace(/^\d+\.\s/, '')} · ${score} pts`;
      $('barfill').style.width = Math.min(100, (score % 100)) + '%';
    }
    cp.textContent = `🔥 Combo x${combo}`;
    cp.classList.toggle('combo-active', combo > 1);
    $('combofill').style.width = combo > 1 ? Math.min(100, (comboTimer / COMBO_MAX_TIME) * 100) + '%' : '0%';
    $('wname').textContent = (rapidTimer > 0 ? '⚡ ' : '🔫 ') + WEAPONS[cur].name;

    if (mode === 'survival' || mode === 'invasion') {
      $('time').textContent = `⏱ ${Math.floor(timeLeft)} s`;
      $('time').style.color = '';
    } else {
      $('time').textContent = (freezeTimer > 0 ? '❄️ ' : '⏱ ') + Math.ceil(timeLeft) + ' s';
      $('time').style.color = (timeLeft < 10 && freezeTimer <= 0 && Math.floor(clock / 280) % 2) ? '#ff5252' : (freezeTimer > 0 ? '#38bdf8' : '');
    }
  } else if (mObj.cat === 'voiture') {
    const hearts = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
    $('score').textContent = `${mObj.icon} ${score} pts · ${hearts}`;
    cp.textContent = mode === 'course' ? `🛣️ ${Math.floor(RACE.dist)} m` : `🚓 ${DRIFT.cops.length} polices`;
    cp.classList.toggle('combo-active', mode === 'course' && RACE.nitro > 0);
    $('barfill').style.width = Math.min(100, (score % 100)) + '%';
    $('combofill').style.width = mode === 'course' ? Math.min(100, (RACE.nitro / 3200) * 100) + '%' : '100%';
    $('time').textContent = `⏱ ${Math.floor(timeLeft)} s`;
    $('time').style.color = '';
    $('wname').textContent = `🏎️ ${CARS[P.car].name}`;
  } else {
    // Jeux de cartes
    $('score').textContent = `${mObj.icon} ${mObj.name.replace(/^\d+\.\s/, '')} · ${score} pts`;
    if (mode === 'uno') {
      cp.textContent = `🃏 Toi: ${UNO.playerHand.length} · IA: ${UNO.aiHand.length}`;
      $('barfill').style.width = Math.max(5, 100 - UNO.playerHand.length * 10) + '%';
    } else if (mode === 'bataille') {
      cp.textContent = `⚔️ Toi: ${BATAILLE.playerDeck.length} · IA: ${BATAILLE.aiDeck.length}`;
      $('barfill').style.width = (BATAILLE.playerDeck.length / 52) * 100 + '%';
    } else {
      cp.textContent = `💰 Mise : ${BJ.bet} 🪙`;
      $('barfill').style.width = Math.min(100, (calcBjScore(BJ.playerHand) / 21) * 100) + '%';
    }
    cp.classList.remove('combo-active');
    $('combofill').style.width = '100%';
    $('time').textContent = `⏱ ${Math.floor(timeLeft)} s`;
    $('time').style.color = '';
    $('wname').textContent = `🌍 ${THEMES[P.theme].name}`;
  }

  $('total').textContent = `🏆 Record ${P.best[mode] || 0}`;
}

function mkBtn(label, dis, act, fn) {
  const b = document.createElement('button');
  b.textContent = label;
  b.disabled = dis;
  if (act) b.className = 'active';
  b.onclick = fn;
  return b;
}

function updateQuestNotifications() {
  const readyCount = countClaimableQuests();
  const topBtn = $('btn-quests-top');
  const tabBtn = $('tab-quests-btn');
  topBtn.innerHTML = readyCount > 0 ? `📜 Quêtes <span class="notif-badge">${readyCount}</span>` : '📜 Quêtes';
  tabBtn.innerHTML = readyCount > 0 ? `📜 Quêtes <span class="notif-badge">${readyCount}</span>` : '📜 Quêtes';
}

function renderShops() {
  dirty = false;
  updateQuestNotifications();
  $('tokens').textContent = `🪙 Jetons : ${P.tokens}`;
  const box = $('shop-content');
  box.innerHTML = '';

  if (shopTab === 'weapons') {
    WEAPONS.forEach((w, i) => {
      const own = P.wOwned.includes(i);
      const lbl = own ? `${w.name} ✔` : `${w.name} · ${w.price} 🪙`;
      box.appendChild(mkBtn(lbl, !own && P.tokens < w.price, own && cur === i, () => {
        if (own) cur = i;
        else {
          if (P.tokens < w.price) return;
          P.tokens -= w.price; P.wOwned.push(i); cur = i;
          SFX.buy();
        }
        dirty = true; save();
      }));
    });
  } else if (shopTab === 'cars') {
    CARS.forEach((c, i) => {
      const own = P.cOwned.includes(i);
      const lbl = own
        ? `🏎️ ${c.name} ✔`
        : `🏎️ ${c.name} · ${c.price} 🪙`;
      box.appendChild(mkBtn(lbl, !own && P.tokens < c.price, P.car === i, () => {
        if (!own) {
          if (P.tokens < c.price) return;
          P.tokens -= c.price; P.cOwned.push(i);
          SFX.buy();
        }
        P.car = i;
        dirty = true; save();
      }));
    });
  } else if (shopTab === 'shooters') {
    SHOOTERS.forEach((s, i) => {
      const own = P.sOwned.includes(i);
      const lbl = `${s.e} ${s.n}` + (own ? '' : ` · ${s.price} 🪙`);
      box.appendChild(mkBtn(lbl, !own && P.tokens < s.price, P.shooter === i, () => {
        if (!own) {
          if (P.tokens < s.price) return;
          P.tokens -= s.price; P.sOwned.push(i);
          SFX.buy();
        }
        P.shooter = i; dirty = true; save();
      }));
    });
  } else if (shopTab === 'themes') {
    THEMES.forEach((t, i) => {
      const own = themeOwned(i);
      const lbl = own
        ? `${t.ico} ${t.name}`
        : t.price !== undefined
          ? `${t.ico} ${t.name} · ${t.price} 🪙`
          : `${t.ico} ${t.name} · Niv.${t.lvl}`;
      box.appendChild(mkBtn(lbl, !own && (t.price === undefined || P.tokens < t.price), P.theme === i, () => {
        if (!own) {
          if (t.price === undefined || P.tokens < t.price) return;
          P.tokens -= t.price; P.tOwned.push(i);
          SFX.buy();
        }
        P.theme = i; dirty = true; save();
      }));
    });
  } else if (shopTab === 'quests') {
    const t1 = document.createElement('div');
    t1.className = 'quests-section-title';
    t1.textContent = '⚡ Quêtes Actives Multi-Jeux (Tir, Voitures & Cartes)';
    box.appendChild(t1);

    const g1 = document.createElement('div');
    g1.className = 'quests-grid';
    P.activeQuests.forEach((q, idx) => {
      const ready = q.prog >= q.goal;
      const pct = Math.min(100, Math.round((q.prog / q.goal) * 100));
      const card = document.createElement('div');
      card.className = 'quest-card' + (ready ? ' ready' : '');
      card.innerHTML = `
        <div class="q-top">
          <div class="q-title">${q.title}</div>
          <span class="q-reward">+${q.reward} 🪙</span>
        </div>
        <div class="q-prog-wrap">
          <div class="q-bar"><i style="width:${pct}%"></i></div>
          <span class="q-txt">${q.prog}/${q.goal}</span>
        </div>
      `;
      if (ready) {
        const claimBtn = document.createElement('button');
        claimBtn.className = 'btn-gold';
        claimBtn.textContent = `🎁 Réclamer +${q.reward} 🪙`;
        claimBtn.onclick = () => {
          P.tokens += q.reward;
          P.xp += q.reward;
          SFX.buy();
          const existing = P.activeQuests.map(x => x.title);
          P.activeQuests[idx] = generateQuest(existing);
          dirty = true; save();
        };
        card.appendChild(claimBtn);
      }
      g1.appendChild(card);
    });
    box.appendChild(g1);

    const t2 = document.createElement('div');
    t2.className = 'quests-section-title';
    t2.textContent = '🏆 Succès de Carrière (9 Défis)';
    box.appendChild(t2);

    const g2 = document.createElement('div');
    g2.className = 'quests-grid';
    CAREER_ACHIEVEMENTS.forEach(c => {
      const claimed = P.claimedCareer.includes(c.id);
      const curVal = Math.min(c.goal, c.check());
      const ready = !claimed && curVal >= c.goal;
      const pct = Math.min(100, Math.round((curVal / c.goal) * 100));
      const card = document.createElement('div');
      card.className = 'quest-card' + (ready ? ' ready' : '');
      card.innerHTML = `
        <div class="q-top">
          <div class="q-title">${c.title}</div>
          <span class="q-reward">${claimed ? '✔ Obtenu' : `+${c.reward} 🪙`}</span>
        </div>
        <div class="q-prog-wrap">
          <div class="q-bar"><i style="width:${pct}%"></i></div>
          <span class="q-txt">${curVal}/${c.goal}</span>
        </div>
      `;
      if (ready) {
        const claimBtn = document.createElement('button');
        claimBtn.className = 'btn-gold';
        claimBtn.textContent = `🎁 Réclamer +${c.reward} 🪙`;
        claimBtn.onclick = () => {
          P.tokens += c.reward;
          P.xp += c.reward;
          P.claimedCareer.push(c.id);
          SFX.win();
          dirty = true; save();
        };
        card.appendChild(claimBtn);
      }
      g2.appendChild(card);
    });
    box.appendChild(g2);
  } else if (shopTab === 'stats') {
    const grid = document.createElement('div');
    grid.className = 'stats-grid';
    MODES.forEach(m => {
      const card = document.createElement('div');
      card.className = 'stat-card';
      card.innerHTML = `<h4>${m.icon} ${m.name}</h4><p>${P.best[m.id] || 0} pts</p>`;
      grid.appendChild(card);
    });
    box.appendChild(grid);
  }
}

/* ============================================================================
   11. CONTRÔLES SOURIS, TACTILE & CLAVIER + BOUCLE PRINCIPALE
   ============================================================================ */
function setMouse(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = clamp((e.clientX - r.left) * W / r.width, 0, W);
  mouse.y = clamp((e.clientY - r.top) * H / r.height, 0, H);
}

cv.addEventListener('pointermove', setMouse);
cv.addEventListener('pointerdown', e => {
  setMouse(e);
  mouse.down = true;
  holding = true;
  const mObj = MODES.find(m => m.id === mode);
  if (state === 'play') {
    if (mObj.cat === 'tir') shoot(performance.now());
    else if (mObj.cat === 'cartes') handleCardCanvasClick(mouse.x, mouse.y);
  }
});
window.addEventListener('pointerup', () => {
  mouse.down = false;
  holding = false;
});

function switchTab(tabName) {
  shopTab = tabName;
  document.querySelectorAll('#shop-tabs .tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tabName);
  });
  dirty = true;
}

$('pause').onclick = togglePause;
$('btn-modes').onclick = openModeSelector;
$('btn-quests-top').onclick = () => {
  switchTab('quests');
  $('shop-container').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};
$('btn-sound').onclick = () => {
  P.sound = !P.sound;
  $('btn-sound').textContent = P.sound ? '🔊 Son' : '🔇 Muet';
  if (P.sound) SFX.init();
  save();
};
$('btn-sound').textContent = P.sound ? '🔊 Son' : '🔇 Muet';

document.querySelectorAll('#shop-tabs .tab-btn').forEach(btn => {
  btn.onclick = () => switchTab(btn.dataset.tab);
});

document.querySelectorAll('#cat-filters .cat-btn').forEach(btn => {
  btn.onclick = () => {
    hubCat = btn.dataset.cat;
    document.querySelectorAll('#cat-filters .cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === hubCat));
    showMenuOverlay($('title').textContent, $('desc').innerHTML, $('go').textContent);
  };
});

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
    if (state === 'play' || state === 'paused') togglePause();
    return;
  }
  const mObj = MODES.find(m => m.id === mode);
  if (mObj && mObj.cat === 'tir') {
    if (e.key >= '1' && e.key <= '9') {
      const i = +e.key - 1;
      if (P.wOwned.includes(i)) { cur = i; dirty = true; }
    } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const list = [...P.wOwned].sort((a, b) => a - b);
      const idx = list.indexOf(cur);
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      cur = list[(idx + dir + list.length) % list.length];
      dirty = true;
    }
    if (e.code === 'Space') { e.preventDefault(); shoot(performance.now()); }
  } else if (mode === 'bataille' && state === 'play' && e.code === 'Space') {
    e.preventDefault();
    stepBataille();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

$('go').onclick = () => {
  if (state === 'paused') {
    togglePause();
  } else if (state === 'levelup') {
    level = Math.min(level + 1, LEVELS.length - 1);
    nextCampaignLevel();
  } else {
    startMode(mode);
  }
};

function update(dt) {
  clock += dt;
  for (const p of parts) { p.vy += 0.12 * dt / 16; p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.rot += p.vr * dt / 16; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.life -= dt; p.y -= dt * 0.048; }
  pops = pops.filter(p => p.life > 0);
  shake *= Math.pow(0.87, dt / 16);

  const mObj = MODES.find(m => m.id === mode);
  if (mObj.cat === 'tir') updateShooting(dt);
  else if (mode === 'course') updateRace(dt);
  else if (mode === 'drift') updateDrift(dt);
  else if (mode === 'uno') updateUno(dt);
  else timeLeft += dt / 1000;
}

function draw() {
  const mObj = MODES.find(m => m.id === mode);
  if (mObj.cat === 'tir') drawShooting();
  else if (mObj.cat === 'voiture') drawRaceAndDrift();
  else drawCardGames();
}

function frame(now) {
  const dt = Math.min(50, now - (last || now));
  last = now;
  if (state === 'play') update(dt);
  if (dirty) renderShops();
  draw();
  updateHUD();
  requestAnimationFrame(frame);
}

openModeSelector();
requestAnimationFrame(frame);
</script>
