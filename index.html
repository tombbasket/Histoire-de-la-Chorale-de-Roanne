<body>

  <!-- Barre supérieure -->
  <div id="topbar">

        <button class="tab-btn active" data-tab="weapons">🔫 Armes</button>
        <button class="tab-btn" data-tab="cars">🏎️ Bolides</button>
        <button class="tab-btn" data-tab="shooters">🎭 Héros</button>

<script>
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, W = 900, H = 520;
const cv = $('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const GUN = { x: W / 2, y: H - 36 };
const rr = (a, b) => a + Math.random() * (b - a);
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const circ = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); };

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ============================================================================
   1. SYNTHÉTISEUR AUDIO WEB AUDIO API (Tir, Voitures, Cartes, Fanfares)
   ============================================================================ */
const SFX = (() => {
  let ac = null;
  function init() {
    if (!ac) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) ac = new AudioCtx();
    }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function noise(dur, freq, type = 'lowpass', vol = 0.24) {
    if (!P.sound || !ac) return;
    const len = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buf;
    const flt = ac.createBiquadFilter();
    flt.type = type;
    flt.frequency.setValueAtTime(freq, ac.currentTime);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    src.connect(flt); flt.connect(g); g.connect(ac.destination);
    src.start();
  }
  function tone(f1, f2, dur, type = 'sine', vol = 0.2, delay = 0) {
    if (!P.sound || !ac) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur);
  }
  return {
    init,
    shoot(w) {
      init();
      if (!P.sound) return;
      const s = w.snd || 'pistol';
      if (s === 'pistol') { noise(0.09, 1800, 'bandpass', 0.22); tone(260, 60, 0.08, 'triangle', 0.18); }
      else if (s === 'heavy') { noise(0.18, 900, 'lowpass', 0.34); tone(150, 35, 0.16, 'sawtooth', 0.24); }
      else if (s === 'shotgun') { noise(0.24, 1100, 'lowpass', 0.38); tone(120, 30, 0.2, 'square', 0.22); }
      else if (s === 'smg') { noise(0.06, 2200, 'bandpass', 0.15); tone(320, 90, 0.05, 'sawtooth', 0.12); }
      else if (s === 'bow') { tone(520, 180, 0.12, 'triangle', 0.18); noise(0.06, 3000, 'highpass', 0.08); }
      else if (s === 'sniper') { noise(0.22, 2600, 'highpass', 0.3); tone(880, 70, 0.22, 'sawtooth', 0.24); }
      else if (s === 'rocket') { noise(0.32, 650, 'lowpass', 0.3); tone(180, 55, 0.28, 'sawtooth', 0.2); }
      else if (s === 'laser') { tone(1250, 220, 0.14, 'sawtooth', 0.2); tone(950, 180, 0.14, 'sine', 0.14); }
    },
    hit(type, combo = 1) {
      init();
      if (!P.sound) return;
      const p = Math.min(1.6, 1 + (combo - 1) * 0.08);
      if (type === 'armor') tone(920, 640, 0.08, 'square', 0.15);
      else if (type === 'canard') { tone(540, 360, 0.09, 'sawtooth', 0.15); tone(580, 340, 0.11, 'sawtooth', 0.15, 0.09); }
      else if (type === 'gold') { tone(880, 1320, 0.1, 'sine', 0.22); tone(1320, 1760, 0.2, 'triangle', 0.22, 0.08); }
      else if (type === 'clock') tone(1046, 1568, 0.14, 'sine', 0.22);
      else if (type === 'bombe' || type === 'otage') { noise(0.42, 420, 'lowpass', 0.42); tone(120, 28, 0.4, 'sawtooth', 0.32); }
      else if (type === 'balloon') { noise(0.07, 3200, 'highpass', 0.26); tone(700, 1100, 0.06, 'sine', 0.18); }
      else if (type === 'ghost') { tone(420, 780, 0.18, 'sine', 0.18); }
      else tone(440 * p, 660 * p, 0.09, 'triangle', 0.18);
    },
    card() { init(); noise(0.055, 3400, 'highpass', 0.2); tone(620, 420, 0.05, 'triangle', 0.12); },
    uno() { init(); tone(660, 880, 0.12, 'triangle', 0.25); tone(880, 1320, 0.2, 'sine', 0.25, 0.1); },
    nitro() { init(); noise(0.28, 1200, 'bandpass', 0.26); tone(220, 680, 0.25, 'sawtooth', 0.2); },
    drift() { init(); noise(0.08, 1500, 'bandpass', 0.08); },
    explode() { init(); noise(0.36, 520, 'lowpass', 0.36); tone(130, 32, 0.34, 'sawtooth', 0.26); },

const KEY_OLD4 = 'arcade-tir-mania-v1';

const KEY_OLD2 = 'stand-de-tir-v2';

const P = {
  tokens: 0,
  maxLevel: 0,
  theme: 0,
  shooter: 0,
  car: 0,
  wOwned: [0],
  cOwned: [0],
  sOwned: [0, 1, 2, 3],
  tOwned: [],
  sound: true,
  xp: 0,
  best: {
    campaign: 0, duckhunt: 0, blitz: 0, survival: 0,
    invasion: 0, boss: 0, farwest: 0, ghost: 0, balloons: 0,
    course: 0, drift: 0, uno: 0, bataille: 0, blackjack: 0
  },
  stats: { totalKills: 0, bossesDefeated: 0, cardWins: 0, policeWrecked: 0 },
  activeQuests: [],
  claimedCareer: []
};

function generateQuest(excludeTitles = []) {
  const pool = QUEST_TEMPLATES.filter(q => !excludeTitles.includes(q.title));
  const tpl = pool[Math.floor(Math.random() * pool.length)] || QUEST_TEMPLATES[0];
  return {
    id: 'q_' + Date.now() + '_' + Math.floor(Math.random() * 9999),
    type: tpl.type,
    title: tpl.title,
    goal: tpl.goal,
    prog: 0,
    reward: tpl.reward
  };
}

function ensureQuests() {
  if (!Array.isArray(P.activeQuests)) P.activeQuests = [];
  while (P.activeQuests.length < 3) {
    const existing = P.activeQuests.map(q => q.title);
    P.activeQuests.push(generateQuest(existing));
  }
}

function save() {
  try { localStorage.setItem(KEY_MAIN, JSON.stringify(P)); } catch (e) {}
}

function load() {
  try {
    const raw = localStorage.getItem(KEY_MAIN) || localStorage.getItem(KEY_OLD4) || localStorage.getItem(KEY_OLD3) || localStorage.getItem(KEY_OLD2);
    if (raw) {
      const parsed = JSON.parse(raw);
      Object.assign(P, parsed);
      P.best = Object.assign({
        campaign: 0, duckhunt: 0, blitz: 0, survival: 0,
        invasion: 0, boss: 0, farwest: 0, ghost: 0, balloons: 0,
        course: 0, drift: 0, uno: 0, bataille: 0, blackjack: 0
      }, parsed.best || {});
      P.stats = Object.assign({ totalKills: 0, bossesDefeated: 0, cardWins: 0, policeWrecked: 0 }, parsed.stats || {});
      if (!Array.isArray(P.cOwned) || !P.cOwned.length) P.cOwned = [0];
      if (typeof P.car !== 'number') P.car = 0;
      if (!Array.isArray(P.claimedCareer)) P.claimedCareer = [];
    }
  } catch (e) {}
  ensureQuests();
  save();
}
load();

function progressQuest(type, amount = 1, setMax = false) {
  let updated = false;
  for (const q of P.activeQuests) {
    if (q.type === type && q.prog < q.goal) {
      q.prog = setMax ? Math.max(q.prog, amount) : Math.min(q.goal, q.prog + amount);
      updated = true;
    }
  }
  if (updated) {
    dirty = true;
    save();
  }
}

function countClaimableQuests() {
  let count = P.activeQuests.filter(q => q.prog >= q.goal).length;
  for (const c of CAREER_ACHIEVEMENTS) {
    if (!P.claimedCareer.includes(c.id) && c.check() >= c.goal) count++;
  }
  return count;
}

  let x = 0, y = 0;
  if (side === 0) { x = Math.random() * W; y = -30; }
  else if (side === 1) { x = W + 30; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + 30; }
  else { x = -30; y = Math.random() * H; }
  DRIFT.cops.push({ x, y, angle: 0, spd: 2.3 + Math.min(1.6, score / 90) });
}

function updateRace(dt) {
  const carSpec = CARS[P.car];
  const roadLeft = 210, roadRight = W - 210;
  const laneCenters = [265, 388, 512, 635];

  if (RACE.nitro > 0) RACE.nitro = Math.max(0, RACE.nitro - dt);
  if (RACE.invuln > 0) RACE.invuln = Math.max(0, RACE.invuln - dt);

  const baseSpd = (330 + Math.min(340, RACE.dist * 0.08)) * carSpec.speed;
  RACE.speed = RACE.nitro > 0 ? baseSpd * 1.55 : baseSpd;

  const moveSpd = 380 * carSpec.handling * (dt / 1000);
  if (keys['ArrowLeft'] || keys['KeyA'] || keys['KeyQ']) RACE.playerX -= moveSpd;
  if (keys['ArrowRight'] || keys['KeyD']) RACE.playerX += moveSpd;
  if (mouse.down) {
    const diff = mouse.x - RACE.playerX;
    RACE.playerX += clamp(diff * 8 * (dt / 1000), -moveSpd * 1.25, moveSpd * 1.25);
  }
  RACE.playerX = clamp(RACE.playerX, roadLeft + 26, roadRight - 26);

  const dy = RACE.speed * (dt / 1000);
  RACE.roadScroll = (RACE.roadScroll + dy) % 80;
  const prevDist = Math.floor(RACE.dist);
  RACE.dist += dy * 0.12;
  const newDist = Math.floor(RACE.dist);
  if (newDist > prevDist) {
    score += (newDist - prevDist);
    progressQuest('drive_dist', newDist - prevDist);
  }
  timeLeft += dt / 1000;

  // Apparition trafic
  RACE.spawnCD -= dt;
  if (RACE.spawnCD <= 0) {
    const lane = laneCenters[Math.floor(Math.random() * laneCenters.length)];
    const isTruck = Math.random() < 0.28;
    const cols = ['#38bdf8', '#a855f7', '#f43f5e', '#10b981', '#eab308', '#e2e8f0'];
    RACE.obstacles.push({
      x: lane,
      y: -70,
      w: isTruck ? 44 : 36,
      h: isTruck ? 88 : 62,
      vy: RACE.speed * (isTruck ? 0.58 : 0.48),
      color: cols[Math.floor(Math.random() * cols.length)],
      isTruck
    });
    RACE.spawnCD = Math.max(340, 920 - RACE.dist * 0.22);
  }

  // Apparition pièces & flèches Nitro
  RACE.coinCD -= dt;
  if (RACE.coinCD <= 0) {
    const lane = laneCenters[Math.floor(Math.random() * laneCenters.length)];
    const isNitro = Math.random() < 0.24;
    RACE.pickups.push({
      x: lane,
      y: -30,
      r: 18,
      type: isNitro ? 'nitro' : 'coin'
    });
    RACE.coinCD = 550 + Math.random() * 450;
  }

  // Flammes Nitro
  if (RACE.nitro > 0) {
    parts.push({
      x: RACE.playerX + rr(-8, 8), y: RACE.playerY + 34,
      vx: rr(-0.6, 0.6), vy: rr(3, 6), life: 220, max: 220,
      c: Math.random() < 0.5 ? '#38bdf8' : '#fde047', s: 4, rot: 0, vr: 0
    });
  }

  for (const o of RACE.obstacles) {
    o.y += o.vy * (dt / 1000);
    if (Math.abs(o.x - RACE.playerX) < (o.w / 2 + 16) && Math.abs(o.y - RACE.playerY) < (o.h / 2 + 26)) {
      if (RACE.nitro > 0) {
        // Défonce le trafic en mode Nitro !
        o.dead = true;
        score += 15;
        P.tokens += 2;
        progressQuest('tokens', 2);
        SFX.explode();
        shake = 10;
        burst(o.x, o.y, '#38bdf8', 20, 6);
        addPop(o.x, o.y - 20, '⚡ ÉCRASÉ ! +15 pts', '#38bdf8');
      } else if (RACE.invuln <= 0) {
        o.dead = true;
        lives--;
        RACE.invuln = 1500;
        shake = 16;
        SFX.hit('bombe');
        burst(RACE.playerX, RACE.playerY, '#ef4444', 24, 7);
        addPop(RACE.playerX, RACE.playerY - 30, '💥 COLLISION ! -1 ❤️', '#ef4444', 1.2);
        if (lives <= 0) {
          endRun('💥 Crash sur l’autoroute !');
          return;
        }
      }
    }
  }
  RACE.obstacles = RACE.obstacles.filter(o => !o.dead && o.y < H + 110);

  for (const pk of RACE.pickups) {
    pk.y += RACE.speed * 0.85 * (dt / 1000);
    if (Math.hypot(pk.x - RACE.playerX, pk.y - RACE.playerY) < 38) {
      pk.dead = true;
      if (pk.type === 'nitro') {
        RACE.nitro = 3200;
        score += 20;
        SFX.nitro();
        addPop(pk.x, pk.y - 20, '⚡ TURBO NITRO !', '#38bdf8', 1.25);
      } else {
        score += 10;
        P.tokens += 2;
        progressQuest('tokens', 2);
        SFX.buy();
        addPop(pk.x, pk.y - 16, '+10 pts · +2 🪙', '#fde047');
      }
      dirty = true;
      save();
    }
  }
  RACE.pickups = RACE.pickups.filter(pk => !pk.dead && pk.y < H + 50);
}

function updateDrift(dt) {
  const carSpec = CARS[P.car];
  const turnSpd = 3.6 * carSpec.handling * (dt / 1000);
  const accel = 420 * carSpec.speed * (dt / 1000);

  let steering = 0;
  if (keys['ArrowLeft'] || keys['KeyA'] || keys['KeyQ']) steering -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) steering += 1;

  if (mouse.down) {
    const desired = Math.atan2(mouse.y - DRIFT.y, mouse.x - DRIFT.x);
    let diff = desired - DRIFT.angle;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    DRIFT.angle += clamp(diff * 6 * (dt / 1000), -turnSpd * 1.2, turnSpd * 1.2);
    DRIFT.vx += Math.cos(DRIFT.angle) * accel;
    DRIFT.vy += Math.sin(DRIFT.angle) * accel;
  } else {
    DRIFT.angle += steering * turnSpd;
    const thrust = (keys['ArrowDown'] || keys['KeyS']) ? 0.35 : 1.0;
    DRIFT.vx += Math.cos(DRIFT.angle) * accel * thrust;
    DRIFT.vy += Math.sin(DRIFT.angle) * accel * thrust;
  }

  // Physique d'inertie et dérapage contrôlé
  const grip = Math.pow(0.08, dt / 1000);
  DRIFT.vx *= grip;
  DRIFT.vy *= grip;
  const maxV = 270 * carSpec.speed;
  const curV = Math.hypot(DRIFT.vx, DRIFT.vy);
  if (curV > maxV) {
    DRIFT.vx = (DRIFT.vx / curV) * maxV;
    DRIFT.vy = (DRIFT.vy / curV) * maxV;
  }

  DRIFT.x += DRIFT.vx * (dt / 1000);
  DRIFT.y += DRIFT.vy * (dt / 1000);

  // Rebond doux sur les bordures de l'arène
  if (DRIFT.x < 34) { DRIFT.x = 34; DRIFT.vx *= -0.5; }
  if (DRIFT.x > W - 34) { DRIFT.x = W - 34; DRIFT.vx *= -0.5; }
  if (DRIFT.y < 34) { DRIFT.y = 34; DRIFT.vy *= -0.5; }
  if (DRIFT.y > H - 34) { DRIFT.y = H - 34; DRIFT.vy *= -0.5; }

  // Traces de pneus si angle de dérive important
  const velAng = Math.atan2(DRIFT.vy, DRIFT.vx);
  let slip = Math.abs(velAng - DRIFT.angle);
  if (slip > Math.PI) slip = TAU - slip;
  if (curV > 90 && slip > 0.28) {
    DRIFT.skids.push({ x: DRIFT.x, y: DRIFT.y, a: DRIFT.angle, life: 2200 });
    if (Math.random() < 0.35) {
      parts.push({ x: DRIFT.x, y: DRIFT.y, vx: rr(-0.4, 0.4), vy: rr(-0.4, 0.4), life: 320, max: 320, c: 'rgba(226,232,240,0.45)', s: 4.5, rot: 0, vr: 0 });
    }
  }
  for (const s of DRIFT.skids) s.life -= dt;
  DRIFT.skids = DRIFT.skids.filter(s => s.life > 0);

  timeLeft += dt / 1000;

  // Collecte des caisses de jetons
  for (const cr of DRIFT.crates) {
    if (Math.hypot(cr.x - DRIFT.x, cr.y - DRIFT.y) < 36) {
      cr.dead = true;
      score += 15;
      P.tokens += 3;
      progressQuest('tokens', 3);
      SFX.buy();
      burst(cr.x, cr.y, '#ffd166', 16, 5);
      addPop(cr.x, cr.y - 18, '+15 pts · +3 🪙', '#fde047');
      dirty = true;
      save();
    }
  }
  DRIFT.crates = DRIFT.crates.filter(c => !c.dead);
  while (DRIFT.crates.length < 4) spawnDriftCrate();

  // Apparition et poursuite des voitures de police
  DRIFT.copTimer -= dt;
  if (DRIFT.copTimer <= 0 && DRIFT.cops.length < 6) {
    spawnCop();
    DRIFT.copTimer = Math.max(2400, 4800 - score * 12);
  }

  for (let i = 0; i < DRIFT.cops.length; i++) {
    const c = DRIFT.cops[i];
    if (c.dead) continue;
    const targetAng = Math.atan2(DRIFT.y - c.y, DRIFT.x - c.x);
    let diff = targetAng - c.angle;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    c.angle += clamp(diff * 2.4 * (dt / 1000), -2.2 * (dt / 1000), 2.2 * (dt / 1000));
    c.x += Math.cos(c.angle) * c.spd * (dt / 16);
    c.y += Math.sin(c.angle) * c.spd * (dt / 16);

    // Collision entre deux voitures de police -> Explosion & bonus !
    for (let j = i + 1; j < DRIFT.cops.length; j++) {
      const c2 = DRIFT.cops[j];
      if (!c2.dead && Math.hypot(c.x - c2.x, c.y - c2.y) < 34) {
        c.dead = true;
        c2.dead = true;
        score += 30;
        P.tokens += 5;
        P.stats.policeWrecked += 2;
        progressQuest('police_wreck', 2);
        progressQuest('tokens', 5);
        SFX.explode();
        shake = 14;
        burst((c.x + c2.x) / 2, (c.y + c2.y) / 2, '#f97316', 32, 7);
        addPop(c.x, c.y - 20, '🚓💥 POLICE SEMÉE ! +30 pts · +5 🪙', '#38bdf8', 1.2);
        dirty = true;
        save();
      }
    }

    // Collision police -> joueur
    if (!c.dead && Math.hypot(c.x - DRIFT.x, c.y - DRIFT.y) < 32) {
      c.dead = true;
      lives--;
      shake = 16;
      SFX.hit('bombe');
      burst(DRIFT.x, DRIFT.y, '#ef4444', 24, 6);
      addPop(DRIFT.x, DRIFT.y - 24, '🚨 INTERCEPTÉ ! -1 ❤️', '#ef4444', 1.2);
      if (lives <= 0) {
        endRun('🚨 Arrêté par la Police !');
        return;
      }
    }
  }
  DRIFT.cops = DRIFT.cops.filter(c => !c.dead);
}

function drawTopDownCar(x, y, angle, spec, isPolice = false, ph = 0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle + Math.PI / 2);

  // Ombre
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  roundRect(-17, -27, 38, 58, 9);
  ctx.fill();

  // Carrosserie
  ctx.fillStyle = isPolice ? '#0f172a' : spec.body;
  roundRect(-18, -30, 36, 60, 8);
  ctx.fill();

  // Bande racing ou portière police
  ctx.fillStyle = isPolice ? '#f8fafc' : spec.stripe;
  if (isPolice) {
    ctx.fillRect(-17, -10, 34, 20);
  } else {
    ctx.fillRect(-4, -29, 8, 58);
  }

  // Pare-brise & lunette
  ctx.fillStyle = '#020617';
  roundRect(-13, -15, 26, 13, 3);
  ctx.fill();
  roundRect(-12, 10, 24, 10, 3);
  ctx.fill();

  // Phares avant
  ctx.fillStyle = '#fef08a';
  ctx.fillRect(-14, -30, 6, 3);
  ctx.fillRect(8, -30, 6, 3);

  // Gyrophare si Police
  if (isPolice) {
    const redOn = Math.floor(ph / 4) % 2 === 0;
    ctx.fillStyle = redOn ? '#ef4444' : '#3b82f6';
    ctx.fillRect(-11, -2, 10, 5);
    ctx.fillStyle = redOn ? '#3b82f6' : '#ef4444';
    ctx.fillRect(1, -2, 10, 5);
  }

  ctx.restore();
}

function drawRaceAndDrift() {
  const T = THEMES[P.theme];
  const ph = performance.now() / 40;
  ctx.save();
  if (shake > 0.4) ctx.translate(rr(-shake, shake), rr(-shake, shake));

  if (mode === 'course') {
    // Bas-côtés selon le thème
    ctx.fillStyle = T.ground;
    ctx.fillRect(0, 0, W, H);

    // Asphalte autoroute
    const roadLeft = 210, roadW = W - 420;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(roadLeft, 0, roadW, H);

    // Bordures vibreurs rouge/blanc
    for (let y = -80 + RACE.roadScroll; y < H; y += 80) {
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(roadLeft - 12, y, 12, 40);
      ctx.fillRect(roadLeft + roadW, y, 12, 40);
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(roadLeft - 12, y + 40, 12, 40);
      ctx.fillRect(roadLeft + roadW, y + 40, 12, 40);
    }

    // Lignes blanches des 4 voies
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    [326, 450, 574].forEach(lx => {
      for (let y = -80 + RACE.roadScroll; y < H; y += 80) {
        ctx.fillRect(lx - 3, y + 12, 6, 44);
      }
    });

    // Pickups (Pièces & Flèches Nitro)
    for (const pk of RACE.pickups) {
      if (pk.type === 'nitro') {
        ctx.fillStyle = '#0284c7';
        circ(pk.x, pk.y, 19);
        ctx.fillStyle = '#38bdf8';
        circ(pk.x, pk.y, 14);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚡', pk.x, pk.y + 1);
      } else {
        ctx.fillStyle = '#f59e0b';
        circ(pk.x, pk.y, 15);
        ctx.fillStyle = '#fde047';
        circ(pk.x, pk.y, 11);
        ctx.fillStyle = '#78350f';
        ctx.font = '900 13px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🪙', pk.x, pk.y + 1);
      }
    }

    // Trafic
    for (const o of RACE.obstacles) {
      drawTopDownCar(o.x, o.y, Math.PI / 2, { body: o.color, stripe: '#f8fafc' }, false, ph);
    }

    // Voiture du joueur
    if (RACE.invuln <= 0 || Math.floor(clock / 90) % 2 === 0) {
      drawTopDownCar(RACE.playerX, RACE.playerY, -Math.PI / 2, CARS[P.car], CARS[P.car].style === 'police', ph);
    }

    // Particules
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c;
      circ(p.x, p.y, p.s);
    }
    ctx.globalAlpha = 1;

    // Compteur vitesse en bas à droite
    ctx.fillStyle = 'rgba(15,23,42,0.82)';
    roundRect(W - 185, H - 64, 168, 48, 12);
    ctx.fill();
    ctx.fillStyle = RACE.nitro > 0 ? '#38bdf8' : '#ffd166';
    ctx.font = '900 18px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(`${Math.round(RACE.speed * 0.55)} km/h`, W - 101, H - 34);
  } else {
    // Arène Drift & Police
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, W, H);

    // Quadrillage d'asphalte
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 2;
    for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // Bordure arène
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 8;
    ctx.strokeRect(12, 12, W - 24, H - 24);

    // Traces de pneus
    for (const s of DRIFT.skids) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.45, (s.life / 2200) * 0.45);
      ctx.translate(s.x, s.y);
      ctx.rotate(s.a + Math.PI / 2);
      ctx.fillStyle = '#090d16';
      ctx.fillRect(-14, -4, 6, 8);
      ctx.fillRect(8, -4, 6, 8);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // Caisses de jetons
    for (const cr of DRIFT.crates) {
      ctx.save();
      ctx.translate(cr.x, cr.y + Math.sin(clock / 250 + cr.bob) * 4);
      ctx.fillStyle = '#b45309';
      roundRect(-16, -16, 32, 32, 6);
      ctx.fill();
      ctx.strokeStyle = '#fde047';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.font = '18px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🪙', 0, 1);
      ctx.restore();
    }

    // Voitures de police
    for (const c of DRIFT.cops) {
      drawTopDownCar(c.x, c.y, c.angle, null, true, ph);
    }

    // Bolide joueur
    drawTopDownCar(DRIFT.x, DRIFT.y, DRIFT.angle, CARS[P.car], CARS[P.car].style === 'police', ph);

    // Particules fumée/explosions
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c;
      circ(p.x, p.y, p.s);
    }
    ctx.globalAlpha = 1;
  }

  // Textes flottants
  ctx.textAlign = 'center';
  for (const p of pops) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.font = `800 ${Math.round(16 * (p.scale || 1))}px system-ui`;
    ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.lineWidth = 3;
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ============================================================================
   7. MOTEUR DES 3 JEUX DE CARTES : UNO, LA BATAILLE & BLACKJACK 21
   ============================================================================ */
// --- A) UNO ARCADE ---
const UNO = {
  deck: [],
  discard: [],
  playerHand: [],
  aiHand: [],
  currentColor: 'red',
  turn: 'player', // 'player' | 'ai'
  pickingColor: false,
  pendingWildCard: null,
  unoCalled: false,
  status: 'À ton tour ! Joue une carte ou pioche.',
  aiTimer: 0
};

const UNO_COLORS = [
  { id: 'red', label: 'Rouge', hex: '#ef4444' },
  { id: 'blue', label: 'Bleu', hex: '#3b82f6' },
  { id: 'green', label: 'Vert', hex: '#10b981' },
  { id: 'yellow', label: 'Jaune', hex: '#eab308' }
];

function buildUnoDeck() {
  const d = [];
  const cols = ['red', 'blue', 'green', 'yellow'];
  for (const c of cols) {
    d.push({ color: c, val: '0', type: 'num' });
    for (let i = 1; i <= 9; i++) {
      d.push({ color: c, val: String(i), type: 'num' });
      d.push({ color: c, val: String(i), type: 'num' });
    }
    for (let k = 0; k < 2; k++) {
      d.push({ color: c, val: '+2', type: 'draw2' });
      d.push({ color: c, val: '🚫', type: 'skip' });
      d.push({ color: c, val: '⇄', type: 'rev' });
    }
  }
  for (let w = 0; w < 4; w++) {
    d.push({ color: 'wild', val: '🌈', type: 'wild' });
    d.push({ color: 'wild', val: '+4', type: 'wild4' });
  }
  return d.sort(() => Math.random() - 0.5);
}

function drawUnoCardFromDeck() {
  if (UNO.deck.length === 0) {
    const top = UNO.discard.pop();
    UNO.deck = UNO.discard.sort(() => Math.random() - 0.5);
    UNO.discard = top ? [top] : [];
  }
  return UNO.deck.pop();
}

function initUno() {
  UNO.deck = buildUnoDeck();
  UNO.playerHand = [];
  UNO.aiHand = [];
  for (let i = 0; i < 7; i++) {
    UNO.playerHand.push(drawUnoCardFromDeck());
    UNO.aiHand.push(drawUnoCardFromDeck());
  }
  let first = drawUnoCardFromDeck();
  while (first.color === 'wild') {
    UNO.deck.unshift(first);
    first = drawUnoCardFromDeck();
  }
  UNO.discard = [first];
  UNO.currentColor = first.color;
  UNO.turn = 'player';
  UNO.pickingColor = false;
  UNO.pendingWildCard = null;
  UNO.unoCalled = false;
  UNO.status = 'À ton tour ! Clique sur une carte jouable ou sur la pioche.';
  UNO.aiTimer = 0;
  score = 0;
  timeLeft = 0;
}

function canPlayUno(card) {
  const top = UNO.discard[UNO.discard.length - 1];
  if (!top) return true;
  if (card.color === 'wild') return true;
  if (card.color === UNO.currentColor) return true;
  if (card.val === top.val) return true;
  return false;
}

function finishUnoMatch(playerWon) {
  const bonusTokens = playerWon ? (15 + UNO.aiHand.length * 3) : 3;
  const pts = playerWon ? (100 + UNO.aiHand.length * 15) : 15;
  score += pts;
  P.tokens += bonusTokens;
  progressQuest('tokens', bonusTokens);
  if (playerWon) {
    P.stats.cardWins++;
    progressQuest('card_wins', 1);
    SFX.win();
  } else {
    SFX.lose();
  }
  dirty = true;
  save();
  endRun(playerWon ? `🌈 VICTOIRE AU UNO ! (+${bonusTokens} 🪙)` : '🤖 L’IA a vidé sa main en premier !');
}

function applyUnoCardEffect(card, who) {
  const oppHand = who === 'player' ? UNO.aiHand : UNO.playerHand;
  if (card.type === 'draw2') {
    oppHand.push(drawUnoCardFromDeck(), drawUnoCardFromDeck());
    UNO.status = who === 'player' ? '💥 +2 cartes pour l’IA et tu rejoues !' : '😱 L’IA te met +2 cartes et rejoue !';
    return true; // rejoue en duel 1v1
  }
  if (card.type === 'wild4') {
    for (let i = 0; i < 4; i++) oppHand.push(drawUnoCardFromDeck());
    UNO.status = who === 'player' ? '🔥 SUPER +4 ! L’IA pioche 4 cartes et tu rejoues !' : '💥 L’IA joue un +4 ! Tu pioches 4 cartes !';
    return true;
  }
  if (card.type === 'skip' || card.type === 'rev') {
    UNO.status = who === 'player' ? '🚫 Tour passé ! Tu rejoues !' : '🚫 L’IA passe ton tour et rejoue !';
    return true;
  }
  return false;
}

function playUnoPlayerCard(idx) {
  if (UNO.turn !== 'player' || UNO.pickingColor) return;
  const card = UNO.playerHand[idx];
  if (!card || !canPlayUno(card)) {
    SFX.lose();
    UNO.status = '⚠️ Carte incompatible ! Choisis même couleur, même symbole ou Joker.';
    return;
  }

  UNO.playerHand.splice(idx, 1);
  UNO.discard.push(card);
  SFX.card();

  if (card.type !== 'num') progressQuest('uno_special', 1);

  if (UNO.playerHand.length === 0) {
    finishUnoMatch(true);
    return;
  }

  // Pénalité oubli UNO si 1 carte restante sans avoir cliqué UNO
  if (UNO.playerHand.length === 1 && !UNO.unoCalled) {
    UNO.playerHand.push(drawUnoCardFromDeck(), drawUnoCardFromDeck());
    addPop(W / 2, H - 150, '⚠️ Contre-UNO ! +2 cartes (clique UNO avant !)', '#ef4444', 1.1);
  }
  UNO.unoCalled = false;

  if (card.color === 'wild') {
    UNO.pickingColor = true;
    UNO.pendingWildCard = card;
    UNO.status = '🎨 Choisis la nouvelle couleur !';
    return;
  }

  UNO.currentColor = card.color;
  const playAgain = applyUnoCardEffect(card, 'player');
  if (!playAgain) {
    UNO.turn = 'ai';
    UNO.aiTimer = 950;
    UNO.status = '🤖 L’IA réfléchit...';
  }
}

function chooseUnoWildColor(colId) {
  if (!UNO.pickingColor) return;
  UNO.currentColor = colId;
  UNO.pickingColor = false;
  const card = UNO.pendingWildCard;
  UNO.pendingWildCard = null;
  SFX.uno();
  const playAgain = applyUnoCardEffect(card, 'player');
  if (!playAgain) {
    UNO.turn = 'ai';
    UNO.aiTimer = 950;
    UNO.status = '🤖 L’IA réfléchit...';
  }
}

function updateUno(dt) {
  timeLeft += dt / 1000;
  if (UNO.turn === 'ai' && !UNO.pickingColor) {
    UNO.aiTimer -= dt;
    if (UNO.aiTimer <= 0) {
      const validIdx = UNO.aiHand.findIndex(c => canPlayUno(c));
      if (validIdx !== -1) {
        const card = UNO.aiHand.splice(validIdx, 1)[0];
        UNO.discard.push(card);
        SFX.card();
        if (UNO.aiHand.length === 0) {
          finishUnoMatch(false);
          return;
        }
        if (UNO.aiHand.length === 1) {
          SFX.uno();
          addPop(W / 2, 110, '🤖 L’IA crie : UNO !', '#f43f5e', 1.15);
        }
        if (card.color === 'wild') {
          // L'IA choisit sa couleur majoritaire
          const counts = { red: 0, blue: 0, green: 0, yellow: 0 };
          UNO.aiHand.forEach(c => { if (counts[c.color] !== undefined) counts[c.color]++; });
          UNO.currentColor = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
        } else {
          UNO.currentColor = card.color;
        }
        const aiAgain = applyUnoCardEffect(card, 'ai');
        if (aiAgain) {
          UNO.aiTimer = 1000;
        } else {
          UNO.turn = 'player';
          UNO.status = 'À ton tour ! Joue une carte ou pioche.';
        }
      } else {
        const drawn = drawUnoCardFromDeck();
        UNO.aiHand.push(drawn);
        SFX.card();
        UNO.turn = 'player';
        UNO.status = '🤖 L’IA a pioché une carte. À toi !';
      }
    }
  }
}

// --- B) LA BATAILLE (52 CARTES) ---
const BATAILLE = {
  playerDeck: [],
  aiDeck: [],
  pot: [],
  lastPlayerCard: null,
  lastAiCard: null,
  inWar: false,
  status: 'Clique sur ton paquet ou appuie sur Espace pour jouer un pli !'
};

function build52Deck() {
  const suits = ['♠', '♥', '♦', '♣'];
  const labels = [
    { v: 2, t: '2' }, { v: 3, t: '3' }, { v: 4, t: '4' }, { v: 5, t: '5' },
    { v: 6, t: '6' }, { v: 7, t: '7' }, { v: 8, t: '8' }, { v: 9, t: '9' },
    { v: 10, t: '10' }, { v: 11, t: 'V' }, { v: 12, t: 'D' }, { v: 13, t: 'R' }, { v: 14, t: 'A' }
  ];
  const d = [];
  for (const s of suits) {
    for (const l of labels) {
      d.push({ suit: s, val: l.v, label: l.t, isRed: (s === '♥' || s === '♦') });
    }
  }
  return d.sort(() => Math.random() - 0.5);
}

function initBataille() {
  const full = build52Deck();
  BATAILLE.playerDeck = full.slice(0, 26);
  BATAILLE.aiDeck = full.slice(26);
  BATAILLE.pot = [];
  BATAILLE.lastPlayerCard = null;
  BATAILLE.lastAiCard = null;
  BATAILLE.inWar = false;
  BATAILLE.status = 'Clique sur « Jouer un pli » (ou Espace) pour lancer le duel !';
  score = 0;
  timeLeft = 0;
}

function stepBataille() {
  if (BATAILLE.playerDeck.length === 0 || BATAILLE.aiDeck.length === 0) {
    const won = BATAILLE.playerDeck.length > BATAILLE.aiDeck.length;
    const reward = won ? 35 : 5;
    P.tokens += reward;
    score += won ? 150 : 20;
    progressQuest('tokens', reward);
    if (won) {
      P.stats.cardWins++;
      progressQuest('card_wins', 1);
      SFX.win();
    } else SFX.lose();
    dirty = true;
    save();
    endRun(won ? `⚔️ VICTOIRE À LA BATAILLE ! (+${reward} 🪙)` : '🤖 L’adversaire a remporté toutes les cartes !');
    return;
  }

  SFX.card();

  // Si on était en état de Bataille (égalité précédente), on pose 1 carte face cachée chacun puis la carte décisive
  if (BATAILLE.inWar) {
    if (BATAILLE.playerDeck.length > 1) BATAILLE.pot.push(BATAILLE.playerDeck.shift());
    if (BATAILLE.aiDeck.length > 1) BATAILLE.pot.push(BATAILLE.aiDeck.shift());
    BATAILLE.inWar = false;
  }

  const pc = BATAILLE.playerDeck.shift();
  const ac = BATAILLE.aiDeck.shift();
  BATAILLE.lastPlayerCard = pc;
  BATAILLE.lastAiCard = ac;
  BATAILLE.pot.push(pc, ac);

  if (pc.val > ac.val) {
    const wonCount = BATAILLE.pot.length;
    BATAILLE.playerDeck.push(...BATAILLE.pot.sort(() => Math.random() - 0.5));
    BATAILLE.pot = [];
    score += wonCount * 5;
    P.tokens += 1;
    progressQuest('battle_tricks', 1);
    progressQuest('tokens', 1);
    BATAILLE.status = `✅ Tu gagnes le pli (${pc.label}${pc.suit} bat ${ac.label}${ac.suit}) ! +${wonCount} cartes & +1 🪙`;
    addPop(W / 2, H / 2 - 40, `+${wonCount} cartes · +1 🪙`, '#4ade80');
    dirty = true;
    save();
  } else if (ac.val > pc.val) {
    const lostCount = BATAILLE.pot.length;
    BATAILLE.aiDeck.push(...BATAILLE.pot.sort(() => Math.random() - 0.5));
    BATAILLE.pot = [];
    BATAILLE.status = `❌ L'adversaire gagne ce pli (${ac.label}${ac.suit} bat ${pc.label}${pc.suit}).`;
  } else {
    BATAILLE.inWar = true;
    SFX.uno();
    BATAILLE.status = `⚔️ BATAILLE ! Égalité sur ${pc.label} ! Clique encore pour la carte décisive !`;
    addPop(W / 2, H / 2 - 20, '⚔️ BATAILLE !', '#fde047', 1.3);
  }
}

// --- C) BLACKJACK 21 ---
const BJ = {
  deck: [],
  playerHand: [],
  dealerHand: [],
  bet: 10,
  phase: 'bet', // 'bet' | 'play' | 'done'
  status: 'Choisis ta mise en jetons puis clique sur Distribuer !'
};

function initBlackjack() {
  BJ.deck = build52Deck().concat(build52Deck());
  BJ.playerHand = [];
  BJ.dealerHand = [];
  BJ.bet = Math.min(10, Math.max(0, P.tokens));
  BJ.phase = 'bet';
  BJ.status = 'Choisis ta mise (10, 25, 50 ou Gratuit) et lance la donne !';
  score = 0;
  timeLeft = 0;
}

function calcBjScore(hand) {
  let sum = 0, aces = 0;
  for (const c of hand) {
    if (c.val === 14) { sum += 11; aces++; }
    else if (c.val >= 10) sum += 10;
    else sum += c.val;
  }
  while (sum > 21 && aces > 0) { sum -= 10; aces--; }
  return sum;
}

function startBjRound() {
  if (BJ.deck.length < 20) BJ.deck = build52Deck().concat(build52Deck());
  if (BJ.bet > P.tokens) BJ.bet = P.tokens;
  P.tokens -= BJ.bet;
  dirty = true;
  save();

  BJ.playerHand = [BJ.deck.pop(), BJ.deck.pop()];
  BJ.dealerHand = [BJ.deck.pop(), BJ.deck.pop()];
  BJ.phase = 'play';
  SFX.card();

  const pScore = calcBjScore(BJ.playerHand);
  if (pScore === 21) {
    finishBjRound(true);
  } else {
    BJ.status = `Tu as ${pScore} points. Tire une carte, Reste ou Double !`;
  }
}

function bjHit() {
  if (BJ.phase !== 'play') return;
  BJ.playerHand.push(BJ.deck.pop());
  SFX.card();
  const s = calcBjScore(BJ.playerHand);
  if (s > 21) {
    finishBjRound(false);
  } else if (s === 21) {
    bjStand();
  } else {
    BJ.status = `Total : ${s} points. Encore une carte ou tu restes ?`;
  }
}

function bjDouble() {
  if (BJ.phase !== 'play' || P.tokens < BJ.bet) return;
  P.tokens -= BJ.bet;
  BJ.bet *= 2;
  dirty = true;
  save();
  BJ.playerHand.push(BJ.deck.pop());
  SFX.card();
  if (calcBjScore(BJ.playerHand) > 21) finishBjRound(false);
  else bjStand();
}

function bjStand() {
  if (BJ.phase !== 'play') return;
  while (calcBjScore(BJ.dealerHand) < 17) {
    BJ.dealerHand.push(BJ.deck.pop());
  }
  finishBjRound(false);
}

function finishBjRound(naturalBj) {
  BJ.phase = 'done';
  const ps = calcBjScore(BJ.playerHand);
  const ds = calcBjScore(BJ.dealerHand);
  const baseBet = Math.max(4, BJ.bet);

  if (ps > 21) {
    SFX.lose();
    BJ.status = `💥 Dépassé (${ps} pts) ! Le croupier gagne.`;
  } else if (naturalBj && ds !== 21) {
    const winTok = Math.ceil(baseBet * 2.5);
    P.tokens += winTok;
    score += 100;
    P.stats.cardWins++;
    progressQuest('card_wins', 1);
    progressQuest('tokens', winTok);
    SFX.win();
    BJ.status = `🃏 BLACKJACK NATUREL ! Tu remportes +${winTok} 🪙 !`;
    addPop(W / 2, H / 2 - 40, `BLACKJACK ! +${winTok} 🪙`, '#fde047', 1.3);
  } else if (ds > 21 || ps > ds) {
    const winTok = baseBet * 2;
    P.tokens += winTok;
    score += 60;
    P.stats.cardWins++;
    progressQuest('card_wins', 1);
    progressQuest('tokens', winTok);
    SFX.win();
    BJ.status = `🎉 Gagné (${ps} contre ${ds}) ! +${winTok} 🪙 !`;
    addPop(W / 2, H / 2 - 40, `GAGNÉ ! +${winTok} 🪙`, '#4ade80', 1.2);
  } else if (ps === ds) {
    P.tokens += BJ.bet;
    SFX.card();
    BJ.status = `🤝 Égalité (${ps} partout). Mise remboursée !`;
  } else {
    SFX.lose();
    BJ.status = `❌ Le croupier gagne (${ds} contre ${ps}).`;
  }
  recordBest(score);
  dirty = true;
  save();
}

function drawPlayingCard(x, y, w, h, label, suit, isRed, faceDown = false, customBg = null, highlight = false) {
  ctx.save();
  ctx.translate(x, y);

  // Ombre
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRect(4, 5, w, h, 10);
  ctx.fill();

  if (faceDown) {
    ctx.fillStyle = '#1e3a8a';
    roundRect(0, 0, w, h, 10);
    ctx.fill();
    ctx.strokeStyle = '#93c5fd';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRect(7, 7, w - 14, h - 14, 6);
    ctx.fill();
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 18px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🕹️', w / 2, h / 2);
  } else {
    ctx.fillStyle = customBg || '#ffffff';
    roundRect(0, 0, w, h, 10);
    ctx.fill();
    ctx.strokeStyle = highlight ? '#fde047' : '#cbd5e1';
    ctx.lineWidth = highlight ? 4 : 2;
    ctx.stroke();

    const fg = customBg ? '#ffffff' : (isRed ? '#dc2626' : '#0f172a');
    ctx.fillStyle = fg;
    ctx.font = '900 17px system-ui';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(label, 8, 7);
    if (suit) ctx.fillText(suit, 8, 25);

    ctx.font = '900 28px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(suit || label, w / 2, h / 2 + 4);
  }
  ctx.restore();
}
